<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problems | CodeArena</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/prob-detail.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <aside class="sidebar">

        <div class="sidebar-logo">
            <h2>CodeArena</h2>
        </div>

        <ul class="sidebar-links">

            <li>
                <a href="dashboard.html">📊 Dashboard</a>
            </li>

            <li class="active">
                <a href="problems.html">💻 Problems</a>
            </li>

            <li>
                <a href="leaderboard.html">🏆 Leaderboard</a>
            </li>

            <li>
                <a href="contest.html">🎯 Contests</a>
            </li>

            <li>
                <a href="profile.html">👤 Profile</a>
            </li>

        </ul>

    </aside>

    <main class="main-content">

        <header class="problems-header">

            <div>
                <h1>Problem Set</h1>
                <p>Practice coding problems and improve your skills.</p>
            </div>

            <button id="themeToggle" class="theme-btn">
                🌙
            </button>

        </header>

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search problems..."
            >

        </section>

        <section class="filter-section">

            <button class="filter-btn active-filter" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="easy">
                Easy
            </button>

            <button class="filter-btn" data-filter="medium">
                Medium
            </button>

            <button class="filter-btn" data-filter="hard">
                Hard
            </button>

        </section>

        <section id="problemContainer" class="problem-grid">


        </section>

    </main>

    <script src="../js/script.js"></script>
    <script src="../js/problems.js"></script>

</body>

</html>
