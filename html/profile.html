<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ByteBattle | Profile</title>

    <link
        rel="stylesheet"
        href="../css/profile.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <img
            src="../img/profile.png"
            class="avatar"
            alt="Profile">

        <h1 id="userName">
            Loading...
        </h1>

        <p id="userEmail"></p>

        <div class="stats">

            <div class="stat">

                <h2 id="problemsSolved">
                    0
                </h2>

                <p>Problems Solved</p>

            </div>

            <div class="stat">

                <h2 id="userXP">
                    0
                </h2>

                <p>XP</p>

            </div>

            <div class="stat">

                <h2 id="userRank">
                    Beginner
                </h2>

                <p>Rank</p>

            </div>

        </div>

        <div class="info">

            <p>

                <strong>Username:</strong>

                <span id="username">
                    -
                </span>

            </p>

            <p>

                <strong>Joined:</strong>

                <span id="joinDate">
                    -
                </span>

            </p>

        </div>

        <div class="buttons">

            <a
                href="leaderboard.html"
                class="btn">

                🏆 Leaderboard

            </a>

            <a
                href="index.html"
                class="btn">

                💻 Solve Problems

            </a>

        </div>

    </div>

</div>

<script src="../js/profile.js"></script>

</body>

</html>
